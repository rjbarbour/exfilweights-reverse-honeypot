core:
  logging:
    debug: false
    debugReportCaller: false
    logDisableTimestamp: false
    # File path, not a directory. Beelzebub opens this with os.OpenFile.
    logsPath: /logs/beelzebub.log
  tracings:
    rabbit-mq:
      enabled: false
      uri: ""
  prometheus:
    path: "/metrics"
    port: ":2112"
  beelzebub-cloud:
    enabled: false
    uri: ""
    auth-token: ""
